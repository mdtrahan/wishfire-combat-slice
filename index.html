<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Wishfire Rust Combat MVP</title>
<style>
html, body { margin: 0; padding: 0; width: 100%; height: 100%; height: 100dvh; overflow: hidden; background: #000; }
canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
</style>
</head>
<body>
<canvas id="glcanvas" tabindex="0" aria-label="Wishfire autonomous combat. P pause, N step, S spotlight preset, 1 2 4 speed, R restart, D debug."></canvas>
<!-- The supplied strict-mode bundle assigns this plugin hook globally. -->
<script>var register_plugin;</script>
<script src="mq_js_bundle.js"></script>
<script>
const gameCanvas = document.getElementById("glcanvas");
gameCanvas.addEventListener("pointerdown", () => gameCanvas.focus());
load("wf_client.wasm");
gameCanvas.focus();
const motionPreference = matchMedia('(prefers-reduced-motion: reduce)');
function syncMotionPreference() {
  if (typeof wasm_exports !== 'undefined' && wasm_exports?.wf_client_reduced_motion) {
    wasm_exports.wf_client_reduced_motion(Number(motionPreference.matches));
  } else { requestAnimationFrame(syncMotionPreference); }
}
motionPreference.addEventListener('change', syncMotionPreference);
syncMotionPreference();
</script>
</body>
</html>
